name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - run: semgrep ci

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/lockhaven-agent/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm format:check

      - run: pnpm build

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flutter-field:
    name: flutter/field (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: linux
          - name: macos
            os: macos-latest
            target: macos
          - name: windows
            os: windows-latest
            target: windows
    defaults:
      run:
        working-directory: apps/lockhaven-field
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux desktop packages
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libusb-1.0-0-dev libgd-dev \
            python3-venv python3-pip curl bzip2 zip

      - name: macOS print-tool packages
        if: matrix.target == 'macos'
        working-directory: ${{ github.workspace }}
        run: |
          brew install libusb libgd cmake pkg-config || true
          brew install dylibbundler || true

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      - run: flutter test

      - name: Smoke-test bundled label helper
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        run: bash scripts/test-label-helper-bundle.sh

      - name: Enable Linux desktop
        if: matrix.target == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Build Linux (release)
        if: matrix.target == 'linux'
        env:
          FIELD_HUB_BASE_URL: ${{ vars.FIELD_HUB_BASE_URL }}
        run: |
          define=()
          if [ -n "${FIELD_HUB_BASE_URL:-}" ]; then
            define=(--dart-define="HUB_BASE_URL=${FIELD_HUB_BASE_URL}")
          fi
          flutter build linux --release "${define[@]}"

      - name: Package Linux tarball
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        run: bash scripts/package-lockhaven-field.sh linux

      - name: Build macOS (release)
        if: matrix.target == 'macos'
        env:
          FIELD_HUB_BASE_URL: ${{ vars.FIELD_HUB_BASE_URL }}
        run: |
          define=()
          if [ -n "${FIELD_HUB_BASE_URL:-}" ]; then
            define=(--dart-define="HUB_BASE_URL=${FIELD_HUB_BASE_URL}")
          fi
          flutter build macos --release "${define[@]}"

      - name: Package macOS zip
        if: matrix.target == 'macos'
        working-directory: ${{ github.workspace }}
        run: bash scripts/package-lockhaven-field.sh macos

      - name: Build Windows (release)
        if: matrix.target == 'windows'
        env:
          FIELD_HUB_BASE_URL: ${{ vars.FIELD_HUB_BASE_URL }}
        shell: bash
        run: |
          define=()
          if [ -n "${FIELD_HUB_BASE_URL:-}" ]; then
            define=(--dart-define="HUB_BASE_URL=${FIELD_HUB_BASE_URL}")
          fi
          flutter build windows --release "${define[@]}"

      - name: Package Windows zip
        if: matrix.target == 'windows'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/package-lockhaven-field.sh windows

      - name: Upload Field artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockhaven-field-${{ matrix.target }}
          path: dist/field/lockhaven-field-*
          if-no-files-found: error

  publish-containers:
    needs:
      - semgrep
      - verify
      - flutter-field
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            package: lockhaven-web
            context: .
            file: apps/web/Dockerfile
          - name: worker
            package: lockhaven-worker
            context: .
            file: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Download Field desktop artifacts
        if: matrix.name == 'web'
        uses: actions/download-artifact@v4
        with:
          pattern: lockhaven-field-*
          path: apps/web/public/install
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.package }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:main
