# Field desktop is not part of PR / main CI. Run this when the Flutter
# app itself changed, or when Console should get new Field downloads.
name: Field desktop

on:
  workflow_dispatch:

concurrency:
  group: field-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-field:
    name: flutter/field (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: linux
          - name: macos
            os: macos-latest
            target: macos
          - name: windows
            os: windows-latest
            target: windows
    defaults:
      run:
        working-directory: apps/lockhaven-field
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux desktop packages
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libusb-1.0-0-dev libgd-dev \
            python3-venv python3-pip curl bzip2 zip

      - name: macOS print-tool packages
        if: matrix.target == 'macos'
        working-directory: ${{ github.workspace }}
        run: |
          brew install libusb libgd cmake pkg-config gettext argp-standalone || true
          brew install dylibbundler || true

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      - run: flutter test

      - name: Smoke-test bundled label helper
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        run: bash scripts/test-label-helper-bundle.sh

      - name: Enable Linux desktop
        if: matrix.target == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Build Linux (release)
        if: matrix.target == 'linux'
        env:
          FIELD_HUB_BASE_URL: ${{ vars.FIELD_HUB_BASE_URL }}
        run: |
          define=()
          if [ -n "${FIELD_HUB_BASE_URL:-}" ]; then
            define=(--dart-define="HUB_BASE_URL=${FIELD_HUB_BASE_URL}")
          fi
          flutter build linux --release "${define[@]}"

      - name: Package Linux tarball
        if: matrix.target == 'linux'
        working-directory: ${{ github.workspace }}
        run: bash scripts/package-lockhaven-field.sh linux

      - name: Build macOS (release)
        if: matrix.target == 'macos'
        env:
          FIELD_HUB_BASE_URL: ${{ vars.FIELD_HUB_BASE_URL }}
        run: |
          define=()
          if [ -n "${FIELD_HUB_BASE_URL:-}" ]; then
            define=(--dart-define="HUB_BASE_URL=${FIELD_HUB_BASE_URL}")
          fi
          flutter build macos --release "${define[@]}"

      - name: Package macOS zip
        if: matrix.target == 'macos'
        working-directory: ${{ github.workspace }}
        run: bash scripts/package-lockhaven-field.sh macos

      - name: Build Windows (release)
        if: matrix.target == 'windows'
        env:
          FIELD_HUB_BASE_URL: ${{ vars.FIELD_HUB_BASE_URL }}
        shell: bash
        run: |
          define=()
          if [ -n "${FIELD_HUB_BASE_URL:-}" ]; then
            define=(--dart-define="HUB_BASE_URL=${FIELD_HUB_BASE_URL}")
          fi
          flutter build windows --release "${define[@]}"

      - name: Package Windows zip
        if: matrix.target == 'windows'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/package-lockhaven-field.sh windows

      - name: Upload Field artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockhaven-field-${{ matrix.target }}
          path: dist/field/lockhaven-field-*
          if-no-files-found: error

  publish-web:
    name: publish-web (Field installers)
    needs:
      - flutter-field
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Field desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lockhaven-field-*
          path: apps/web/public/install
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/lockhaven-web" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:main
